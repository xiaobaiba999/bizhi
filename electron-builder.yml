appId: com.wallpaperworkshop.app
productName: 壁纸工坊
copyright: Copyright © 2026 壁纸工坊
directories:
  app: release/app
  output: release/out
  buildResources: build

# 精简 app 壳（release/app：仅 desktop/ 壳代码 + 无依赖 package.json）→ asar 不含 node_modules
files:
  - "**/*"
asar: true
compression: normal
beforeBuild: scripts/eb-before-build.cjs
# 免 wine 说明：通过 build-desktop.mjs 里的补丁，NSIS 卸载器用原生
# UninstallerReader 提取，Linux 交叉打包无需系统 wine
electronLanguages:
  - zh-CN
  - en-US

# 注意：from 必须是 release/resources（而非其子目录 server）——
# electron-builder 的过滤器会无条件丢弃 fileset 根下的 node_modules，
# 提升一层后 server/node_modules 属于「子 node_modules」，可正常复制
extraResources:
  - from: release/resources
    to: app

win:
  icon: build/icon.png
  target:
    - target: nsis
      arch:
        - x64

# NSIS 安装器：向导式安装；用户数据目录（数据库/屏蔽记录）仅在卸载向导中
# 主动勾选「同时删除应用数据」时才删除（见 build/installer.nsh 的自定义卸载页）；
# include：升级数据护送 + 覆盖安装自愈 + 外科清理兜底（见 build/installer.nsh）
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  allowElevation: true
  deleteAppDataOnUninstall: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 壁纸工坊
  artifactName: 壁纸工坊-Setup-${version}.${ext}
  uninstallDisplayName: 壁纸工坊
  include: installer.nsh

linux:
  icon: build/icon.png
  category: Graphics
  target:
    - dir
